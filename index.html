<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>移动图书馆 · 桌面版</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6M7.5 7.5h4"/></symbol>
    <symbol id="i-record" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 12h7M9 16h7M9 8h3"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.5 4.5 0 0 0 7 18Z"/><path d="M8 21c1.5-1 3-1 4.5 0M14 21c1.5-1 3-1 4.5 0"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-9-1v13c4-1 7-.5 9 1 2-1.5 5-2 9-1V5c-4-1-7-.5-9 1Z"/><path d="M12 6v13"/></symbol>
    <symbol id="i-journal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 5v14M11 9h6M11 12h6M11 15h4"/></symbol>
    <symbol id="i-lecture" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M6 21v-3a6 6 0 0 1 12 0v3M4 21h16M9 10.5 5 8M15 10.5 19 8"/></symbol>
    <symbol id="i-academic" viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5-10-5Z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5M22 9v6"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="2"/><path d="M7 14h10v7H7zM17 11h1"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10Z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4 4-2Z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5ZM8 9h8M8 12h5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z" fill="currentColor"/><path d="M4 11v5c0 1.1 3.6 3 8 3s8-1.9 8-3v-5l-8 4-8-4Z" fill="currentColor" opacity=".85"/></svg>
        </span>
        <span class="brand-name">移动图书馆</span>
      </div>
      <nav class="nav">
        <a href="#" class="active">首页</a>
        <a href="#" data-page-jump="0">资源</a>
        <a href="#" data-page-jump="1">服务</a>
        <a href="#">帮助</a>
      </nav>
      <div class="top-actions">
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input type="search" placeholder="搜索图书、期刊、作者" aria-label="搜索" />
        </label>
        <button class="avatar" type="button" title="个人中心">图</button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">READING · LIBRARY · 2026</p>
        <h1>正是读书<span>好时节</span></h1>
        <p class="hero-sub">海量馆藏、云上专题、学术资源，一站式触手可及</p>
        <button class="hero-btn" type="button" id="exploreBtn">开始探索 →</button>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 420 240" fill="none">
          <ellipse cx="215" cy="220" rx="160" ry="12" fill="rgba(5,61,110,.18)"/>
          <path d="M70 150c42-26 92-26 135 0v64c-43-24-93-24-135 0v-64Z" fill="#fff" opacity=".96"/>
          <path d="M205 150c43-26 93-26 135 0v64c-42-24-92-24-135 0v-64Z" fill="#eef6ff"/>
          <path d="M70 150c42-26 92-26 135 0M205 150c43-26 93-26 135 0" stroke="#bcd9f2" stroke-width="2"/>
          <path d="M70 214c43-24 93-24 135 0 42-24 92-24 135 0" stroke="#d8e9f8" stroke-width="6" stroke-linecap="round"/>
          <path d="M250 92c0-17 13-30 30-30s30 13 30 30-13 30-30 30-30-13-30-30Z" fill="#f4c7a4"/>
          <path d="M250 88c-3-20 12-34 30-34 17 0 31 12 31 30-8-6-17-8-26-6-12 2-22 0-35-10Z" fill="#4a3328"/>
          <circle cx="312" cy="58" r="10" fill="#4a3328"/>
          <path d="M246 122c8-10 20-14 34-14s26 4 34 14l12 62h-92l12-62Z" fill="#e95d57"/>
          <path d="M252 132c-16 8-28 22-34 38l16 8c8-14 17-23 28-28M298 132c16 8 28 22 34 38l-16 8c-8-14-17-23-28-28" fill="#f4c7a4"/>
          <path d="M214 170c14-12 30-18 48-18v26c-16 0-32 5-48 14v-22ZM330 152c18 0 34 6 48 18v22c-16-9-32-14-48-14v-26Z" fill="#f7d9c2"/>
          <path d="M40 60c18-22 45-28 68-18-18 22-45 28-68 18Z" fill="rgba(255,255,255,.25)"/>
          <path d="M360 30c18-14 40-14 56 0-18 14-40 14-56 0Z" fill="rgba(255,255,255,.2)"/>
        </svg>
      </div>
    </section>

    <section class="quick-entry">
      <div class="section-head">
        <div>
          <h2>快捷入口</h2>
          <p class="section-desc">常用服务，一点即达</p>
        </div>
        <span class="hint">点击卡片查看对应服务</span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager">
        <button class="dot active" type="button" data-page="0" aria-label="第 1 页"></button>
        <button class="dot" type="button" data-page="1" aria-label="第 2 页"></button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
